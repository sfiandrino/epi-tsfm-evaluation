name: lagllama-engine

on:
  workflow_call:
    inputs:
      target:
        required: true
        type: string
      outdir:
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: lagllama-engine
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    env:
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      TARGET: ${{ inputs.target }}
      OUTDIR: ${{ inputs.outdir }}
      MODEL_NAME: "Lag-Llama"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "forecast-generation/requirements.txt"

      - name: Upgrade pip tooling
        run: python -m pip install --upgrade pip setuptools wheel

      - name: Install repo dependencies
        run: python -m pip install -r forecast-generation/requirements.txt

      - name: Install Lag-Llama
        run: |
          set -euo pipefail
          python -m pip install --no-cache-dir --index-url https://download.pytorch.org/whl/cpu torch torchvision torchaudio
          git clone -b update-gluonts https://github.com/time-series-foundation-models/lag-llama/ lag-llama
          python -m pip install --no-cache-dir -r lag-llama/requirements.txt
          # Optional: ensure Lag-Llama package itself is importable if your script imports it
          python -m pip install --no-cache-dir -e lag-llama

          # Download checkpoint via Python (no CLI required)
          python - <<'PY'
          import os, shutil
          from huggingface_hub import hf_hub_download

          repo_id = "time-series-foundation-models/Lag-Llama"
          filename = "lag-llama.ckpt"
          dest_dir = "lag-llama"

          os.makedirs(dest_dir, exist_ok=True)

          path = hf_hub_download(
              repo_id=repo_id,
              filename=filename,
              # If the repo/file is gated, set HF_TOKEN as a secret and uncomment:
              # token=os.environ.get("HF_TOKEN"),
          )

          shutil.copy(path, os.path.join(dest_dir, filename))
          print("Saved:", os.path.join(dest_dir, filename))
          PY

      - name: Run Lag-Llama forecasts
        working-directory: season-2025-26
        run: python -u ../forecast-generation/run_forecasts.py --target "${TARGET}" --model_name "${MODEL_NAME}"

      - name: Commit and push updated CSVs and Plots
        working-directory: season-2025-26
        run: |
          set -euo pipefail
          shopt -s nullglob

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          csv_files=("${OUTDIR}/"*-"${MODEL_NAME}".csv)
          png_files=("${OUTDIR}/plots/"*-"${MODEL_NAME}".png)

          git add -f "${csv_files[@]}" "${png_files[@]}"

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Update ${MODEL_NAME} forecasts (${TARGET})"
          git push
