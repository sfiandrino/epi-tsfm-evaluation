name: timegpt-us-totalconfflunewadm

on:
  workflow_dispatch:
  schedule:
    - cron: "35 00 * * 4"  # Thu 00:35 UTC

permissions:
  contents: write

jobs:
  call:
    permissions:
      contents: write
    uses: ./.github/workflows/timegpt-engine.yml 
    with:
      target: "totalconfflunewadm"
      outdir: "model-output/FluSight/TimeGPT"
    secrets:
      TIMEGPT_ACCESS_TOKEN: ${{ secrets.TIMEGPT_ACCESS_TOKEN }}
