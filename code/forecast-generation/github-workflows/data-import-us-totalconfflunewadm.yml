name: data-import-us-totalconfflunewadm

on:
  workflow_dispatch:
  schedule:
    - cron: "30 17 * * 3"  # Every Wednesday at 17:30 UTC

permissions:
  contents: write

concurrency:
  group: data-import-us-totalconfflunewadm
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      TARGET: "totalconfflunewadm"
      OUTDIR: "target-data/FluSight"
      SNAPDIR: "target-data/FluSight/snapshots"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "forecast-generation/requirements.txt"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r forecast-generation/requirements.txt

      - name: Run data import
        working-directory: season-2025-26
        run: python -u ../forecast-generation/data_import.py --target "${TARGET}"

      - name: Commit and push updated CSVs
        working-directory: season-2025-26
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Force-add in case target-data/ is gitignored
          git add -f "${OUTDIR}/surveillance_weekly.csv" "${OUTDIR}/surveillance_weekly_interpolated.csv"
          git add -f "${SNAPDIR}/surveillance_weekly_up_to_"*.csv

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Update FluSight surveillance weekly (US totalconfflunewadm)"
          git push
